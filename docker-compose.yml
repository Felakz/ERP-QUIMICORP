version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quimicorp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quimicorp
      POSTGRES_PASSWORD: quimicorp_dev_password
      POSTGRES_DB: quimicorp_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quimicorp_backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quimicorp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"

volumes:
  pgdata:
