name: CI / CD Quality Assurance

on:
  push:
    branches:
      - main
      - feature/Desarrollo
  pull_request:
    branches:
      - main
      - feature/Desarrollo

# Cancel previous in-progress runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Backend Validation (NestJS + Prisma)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate --schema=../prisma/schema.prisma

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Typecheck & Build Backend
        working-directory: ./backend
        run: npm run build

  validate-frontend:
    name: Frontend Validation (Next.js TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck & Build Frontend
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

